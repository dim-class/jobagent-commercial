name: Windows portable candidate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            extension/package-lock.json
      - name: Install backend packaging dependencies
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          backend/.venv/Scripts/python.exe -m pip install -e "backend[packaging]"
      - name: Install web dependencies
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          cd ../extension
          npm ci --no-audit --no-fund
      - name: Build and audit unsigned candidate
        shell: pwsh
        run: ./scripts/build-windows-portable.ps1 -Version "0.1.0-${{ github.run_number }}"
      - name: Verify artifact files
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath .artifacts -Force
          if (-not (Get-ChildItem -LiteralPath .artifacts -Filter 'JobAgent-Windows-x64-*.zip' -File)) { throw 'Portable ZIP was not created.' }
          if (-not (Test-Path -LiteralPath .artifacts/SHA256SUMS.txt)) { throw 'SHA256SUMS.txt was not created.' }
      - uses: actions/upload-artifact@v4
        with:
          name: JobAgent-Windows-x64-unsigned-${{ github.run_number }}
          path: |
            .artifacts/*.zip
            .artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          # `.artifacts` starts with a dot, and upload-artifact v4 treats
          # dot-prefixed paths as hidden and silently skips them. The build and
          # the verify step both succeeded; only the upload found nothing.
          include-hidden-files: true
