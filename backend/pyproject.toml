[project]
name = "jobagent-backend"
version = "0.1.0"
description = "Local-first AI job search assistant - backend (FastAPI + SQLite + OpenAI Agents SDK)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "openai>=1.40",
    "openai-agents>=0.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "playwright>=1.44",
    "alembic>=1.13",
    "psutil>=6.0",
    # Windows ships no IANA tz database; Asia/Tokyo reporting needs it.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4.4",
]
packaging = [
    "pyinstaller==6.22.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# Auto mode so async tests AND async fixtures (Playwright) work without
# per-item decoration. Only the browser-capture tests are async.
asyncio_mode = "auto"
# One event loop for the whole session so the Playwright browser can be
# launched once and reused, instead of relaunching Chromium per test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
