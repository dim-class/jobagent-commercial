<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>[Fixture] JobAgent MV3 E2E</title>
<style>
body { margin: 0; padding: 110px 24px 0; font: 18px Arial; background: #eef7f8; }
.job-list-box { width: 490px; height: 600px; overflow-y: auto; overflow-anchor: none; background: white; }
.job-card-wrapper { margin: 12px; padding: 18px; border: 1px solid #aaa; height: 120px; }
.job-name { display: inline-block; color: #164e63; }
.salary, .job-salary { display: inline-block; color: #f53d32; font: 24px Arial; }
/* Synthetic DOM/render mismatch: real OCR must read the painted digits.
   No live font, credential, recruitment markup capture or font decoding. */
.opaque { font-size: 0; }
.opaque::before { content: "8-13K"; font: 24px Arial; }
.job-detail-box { position: fixed; top: 110px; left: 550px; width: 620px; background: white; padding: 18px; }
.tag-list { display: flex; gap: 18px; list-style: none; padding: 0; }
.spacer { height: 2200px; }
</style>
<div class="job-list-box"><div id="cards"></div><div class="spacer"></div></div>
<div class="job-detail-box"></div>
<script>
const scenario = "normal";
const salaryMode = "opaque";
window.fixtureScrolls = 0;
window.fixtureClicks = [];
const jd = '岗位职责：负责云平台日常运维、系统监控和网络故障排查，维护 Linux 与 Kubernetes 服务。任职要求：熟悉自动化脚本、容器技术及基础设施管理。';
function addCard(n) {
  const card = document.createElement('div'); card.className = 'job-card-wrapper';
  const title = `[Fixture] Cloud Engineer ${n}`;
  card.innerHTML = `<a class="job-name" href="/job_detail/e2e-${n}.html?ka=fixture">${title}</a>
    <span class="salary ${salaryMode}">${salaryMode === 'opaque' ? '\ue039-\ue032\ue033K' : '8-13K'}</span>
    <div class="company-name">Fixture Company ${n}</div><div class="company-location">北京</div>
    <ul class="tag-list"><li>1-3年</li><li>本科</li></ul>`;
  card.querySelector('a').onclick = event => {
    event.preventDefault(); window.fixtureClicks.push(n);
    if (scenario === 'verification') {
      document.querySelector('.job-detail-box').innerHTML = '<div class="verify-wrapper">请完成安全验证</div>'; return;
    }
    const identity = scenario === 'mismatch' ? 99 : n;
    document.querySelector('.job-detail-box').innerHTML = `
      <a class="job-name" href="/job_detail/e2e-${identity}.html">[Fixture] Cloud Engineer ${identity}</a>
      <span class="job-salary ${salaryMode}">${salaryMode === 'opaque' ? '\ue039-\ue032\ue033K' : '8-13K'}</span>
      <div class="job-boss-info"><span class="boss-info-attr">Fixture Company ${identity}</span></div>
      <p class="desc">${jd} ${n}</p>`;
  };
  document.querySelector('#cards').append(card);
}
addCard(1);
document.querySelector('.job-list-box').addEventListener('scroll', () => {
  window.fixtureScrolls++;
  const count = document.querySelector('#cards').children.length;
  if (scenario !== 'no-new' && count < 3) addCard(count + 1);
});
</script></html>
