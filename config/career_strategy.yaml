# JobAgent default career strategy template
#
# This tracked file contains no developer or user profile. Runtime edits are
# saved to gitignored data/career_strategy.yaml through the local setup UI.

version: 1
early_career_policy: include
target_cities: []
remote_ok: true
preferred_roles: []
relevant_skills: []
skill_aliases: {}
excluded_keywords: []
excluded_soft_override_skills: []

experience_policy:
  preferred_min_years: 0
  preferred_max_years: 5
  hard_reject_above_years: 20
  flexibility: balanced
  notes: ""

salary:
  min_monthly_cny: 0
  ideal_monthly_cny: 0
  hard_filter: false

scoring:
  bands:
    strong_apply: 90
    apply: 80
    apply_with_gaps: 70
    maybe: 60
  excluded_role_score_cap: 45
  min_skill_overlap_for_override: 3

preferences:
  notes: ""
