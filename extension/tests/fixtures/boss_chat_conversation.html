<!doctype html>
<meta charset="utf-8">
<title>BOSS chat (structure read from the live page, content authored)</title>
<!--
  The CLASS NAMES here were read from the live /web/geek/chat page on
  2026-09-06 (read-only: one navigation, DOM reads, no conversation selected,
  nothing clicked): `.chat-wrap > .list-warp.v2` is the conversation list and
  `.chat-conversation` is the open one. The page carries ZERO
  /job_detail/ anchors and its list items are plain divs, which is why the
  identity check reads the open conversation's own company and title.

  The CONTENT is authored - no conversation was opened to capture one, and no
  automated test may visit zhipin.com. The header's internal markup is
  therefore still a reconstruction from a screenshot; what the tests pin is
  the reader's logic and its scoping.
-->
<style>
  .chat-wrap { display: flex }
  .list-warp { width: 300px }
  .chat-conversation { width: 600px }
  .chat-input { width: 320px; height: 60px }
  .btn-send { display: inline-block; width: 60px; height: 24px }
  .friend-content-warp { padding: 4px }
</style>

<!-- BOSS's own chrome. It is inside the identity scope, and harmlessly so:
     it names no company and no job. -->
<div class="nav-wrap">
  <a class="logo">BOSS直聘</a>
  <a>首页</a><a>职位</a><a>公司</a><a>消息</a><a>简历</a>
</div>

<div class="chat-container page-container">
  <div class="chat-wrap">

    <!-- Every other recruiter this account has spoken to. A document-wide
         text match would confirm any of these; subtracting this one region
         is the entire safety argument. -->
    <div class="list-warp v2">
      <div class="chat-user v2">
        <div class="chat-content"><div class="user-list"><div class="user-list-content">
          <div class="friend-content-warp"><div class="friend-content">
            <div class="text"><div class="title-box"><span class="name">盛女士</span><span
              class="company-name">浩鲸科技</span></div>
              <div class="gray last-msg">阿里云运维工程师</div></div>
          </div></div>
          <div class="friend-content-warp"><div class="friend-content">
            <div class="text"><div class="title-box"><span class="name">陈星星</span><span
              class="company-name">嘉环科技股份有限公司</span></div>
              <div class="gray last-msg">云计算工程师</div></div>
          </div></div>
        </div></div></div>
      </div>
    </div>

    <!-- The recruiter/company row, and it is NOT inside `.chat-conversation`
         and NOT inside the pane's parent either. Both were tried against the
         live page and both read `co=0` (2026-09-08), so the identity scope is
         the document minus the list above. The company sits in the MIDDLE of
         its row here because that is how the live header reads
         (「刘女士 蚂蚁集团｜HR」) - a prefix rule never saw it. -->
    <!-- `chat-user` is here ON PURPOSE, as a probe. It is not a claim about
         BOSS's markup: only `.list-warp` was read from the live page, and the
         other CHAT_LIST entries are guesses. What IS established (live,
         2026-09-08) is that excluding the union of all four made the company
         unreadable on a page displaying it - three refusals reading `co=0`
         beside `coUp=1` - and that taking `.list-warp` alone sent the next
         greeting. Which fallback was matching the header was never pinned
         down; the ordering makes it moot, and this probe pins the ordering.
         First selector that resolves wins, so `.list-warp` decides and this
         class changes nothing. -->
    <div class="chat-title chat-user">
      <span class="name-box">雷宇博 中信建投证券｜信息技术部人力资源</span>
      <span class="more">更多</span>
    </div>

    <!-- The open conversation. -->
    <div class="chat-box">
      <div class="chat-conversation">
        <div class="job-info">
          <!-- Split across spans on purpose: BOSS does this to a title like
               「云迁移运维工程师＋3个月（朝阳区MQ）」, and a leaf-only reader
               cannot see it. -->
          <span class="job-name">私有云运维<span class="hl">工程师</span> 25-40K</span>
          <span class="city">北京</span>
          <span class="view-job">查看职位</span>
        </div>
        <div class="chat-message-list">
          <div class="message-card">你与该职位竞争者PK情况</div>
        </div>
        <div class="chat-editor">
          <textarea class="chat-input" placeholder="按Enter键发送，按Ctrl+Enter键换行"></textarea>
          <span class="btn-send">发送</span>
        </div>
      </div>
    </div>

  </div>
</div>
