<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>云计算运维工程师-BOSS直聘</title></head>
<body>
  <div class="job-banner">
    <div class="inner home-inner">
      <div class="job-primary detail-box">
        <div class="info-primary">
          <div class="name"><h1>云计算运维工程师</h1><span class="salary">8-13K</span></div>
          <p>
            <a class="text-desc text-city">北京</a>
            <span class="text-desc text-experiece">1-3年</span>
            <span class="text-desc text-degree">大专</span>
          </p>
        </div>
        <!-- Attribute set captured read-only from a real logged-in BOSS detail
             page on 2026-08-31. `ka` / `data-url` / `redirect-url` carry
             session tokens on the live site (379-406 chars); only their
             presence is ever read, so they are placeholders here. -->
        <a class="btn btn-startchat" href="javascript:;" ka="job_detail_startchat_1"
           redirect-url="/web/geek/chat" data-url="/wapi/blocked"
           data-isfriend="false">立即沟通</a>
        <!-- Live BOSS markup includes a responsive hidden duplicate: the strict
             `.btn-startchat` selector matches 2 nodes, exactly 1 of them visible. -->
        <a class="btn btn-startchat" style="display:none" href="javascript:;"
           ka="job_detail_startchat_2" redirect-url="/web/geek/chat"
           data-url="/wapi/blocked" data-isfriend="false">立即沟通</a>
      </div>
    </div>
  </div>
  <div class="job-detail">
    <div class="job-detail-section">
      <div class="job-sec-text">直聘负责云平台日常运维与专BOSS直聘业自动化建设。</div>
      <div class="job-boss-info">
        <div class="detail-figure"></div>
        <h2 class="name">郑女士</h2>
        <div class="boss-info-attr">纳新电子 人力</div>
      </div>
    </div>
    <div class="job-detail-section job-detail-company"><div class="company-card">示例公司</div></div>
  </div>
</body>
</html>
