<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>「北京招聘」-BOSS直聘</title></head>
<body>
<!--
  AUTHORED, NOT CAPTURED.

  Every other fixture here was saved from a real BOSS page. This one was
  written by hand: no capture of the results-page filter bar existed when the
  salary reader was built, and no automated test may visit zhipin.com to make
  one. So a passing test here proves the reader's logic, NOT that it matches
  the live filter bar - that stays a manual claim the user makes after reading
  the bands in their own Chrome and checking a code against BOSS's own URL.
-->
<div class="search-condition-wrapper">
  <div class="condition-filter-select">
    <span class="dropdown-label">工作区域</span>
    <ul class="dropdown-menu">
      <li><a href="/web/geek/jobs?query=x&amp;multiBusinessDistrict=110105">朝阳区</a></li>
      <li><a href="/web/geek/jobs?query=x&amp;multiBusinessDistrict=110108">海淀区</a></li>
      <li><a href="/web/geek/jobs?query=x&amp;multiBusinessDistrict=110106">丰台区</a></li>
    </ul>
  </div>
  <div class="condition-filter-select">
    <span class="dropdown-label">薪资待遇</span>
    <ul class="dropdown-menu">
      <li><a href="/web/geek/jobs?query=x&amp;salary=401">不限</a></li>
      <li><a href="/web/geek/jobs?query=x&amp;salary=402">3K以下</a></li>
      <li><a href="/web/geek/jobs?query=x&amp;salary=405">10-20K</a></li>
      <li><a href="/web/geek/jobs?query=x&amp;salary=406">20-50K</a></li>
      <li><a href="/web/geek/jobs?query=x&amp;salary=407">50K以上</a></li>

      <li><a href="/web/geek/jobs?query=x&amp;experience=104">3-5年</a></li>
      <li><a href="/web/geek/jobs?query=x&amp;experience=105">5-10年</a></li>
      <li><a href="/web/geek/jobs?query=x&amp;experience=106">10年以上</a></li>

  </div>
</div>
