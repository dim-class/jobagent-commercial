<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>北京招聘-BOSS直聘</title></head>
<body>
  <!-- Live-observed shape of /web/geek/jobs: a rendered result list on the
       left, plus a selected-card detail pane on the right that BOSS renders
       automatically. The extension must read only the list and must never
       treat this page as "found 1 job" from the pane. -->
  <ul class="job-list-box">
    <li class="job-card-box">
      <a class="job-card-left" href="/job_detail/live-card-1.html?lid=secret">
        <span class="job-name">云计算运维工程师</span>
        <span class="job-salary">8-12K</span>
        <span class="job-area">北京·西城区</span>
        <ul class="tag-list"><li>1-3年</li><li>大专</li></ul>
      </a>
      <div class="company-name"><a>纳新电子</a></div>
    </li>
    <!-- Same title, same company as card 1 - two different postings BOSS
         itself lists separately. Each must keep its own salary/city/
         experience/education; neither may bleed into the other. -->
    <li class="job-card-box">
      <a class="job-card-left" href="/job_detail/live-card-2.html">
        <span class="job-name">云计算运维工程师</span>
        <span class="job-salary">18-25K</span>
        <span class="job-area">北京·海淀区</span>
        <ul class="tag-list"><li>3-5年</li><li>本科</li></ul>
      </a>
      <div class="company-name"><a>纳新电子</a></div>
    </li>
    <li class="job-card-box">
      <a class="job-card-left" href="/job_detail/live-card-3.html">
        <span class="job-name">云计算工程师</span>
        <span class="job-salary">16-19K</span>
        <span class="job-area">北京</span>
        <ul class="tag-list"><li>1年以内</li><li>硕士</li></ul>
      </a>
      <div class="company-name"><a>信通院</a></div>
    </li>
  </ul>

  <!-- The selected-card detail pane BOSS renders beside the list. Its own
       title/company/salary are deliberately different from every list card
       above, so any test failure that leaks pane content into a candidate
       (instead of ignoring the pane) is caught immediately. -->
  <section class="job-detail-box">
    <div class="job-name">云计算运维工程师（详情面板，应被忽略）</div>
    <span class="job-salary">99-99K</span>
    <div class="job-boss-info"><div class="boss-info-attr">详情面板专属公司 · 招聘经理</div></div>
    <p class="desc">这是详情面板自己的描述文字，不应出现在任何卡片结果里。</p>
  </section>
</body>
</html>
